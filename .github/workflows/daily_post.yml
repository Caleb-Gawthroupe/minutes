name: Daily Instagram Post

on:
  schedule:
    # Runs at 13:00 UTC (9:00 AM EST) every day
    - cron: '0 13 * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub UI
  repository_dispatch: # Allows triggering via an external API "ping"
    types: [ping-pipeline]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache database
        uses: actions/cache@v4
        with:
          path: data/
          key: ${{ runner.os }}-chromadb-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-chromadb-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          HEADLESS: "false"
        run: |
          # Use xvfb to run Playwright in a "headed" environment for stealth
          xvfb-run python3 single_post_pipeline.py
